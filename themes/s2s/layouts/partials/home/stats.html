<section class="home-section">
  <div class="container">
    <div class="row row-cols-1 row-cols-md-3 g-4 text-center">
      {{ range .items }}
        <div class="col">
          <div class="home-stat-value">{{ .value }}</div>
          <p class="home-stat-label mb-0">{{ .label }}</p>
        </div>
      {{ end }}
    </div>
  </div>
</section>
