<section class="home-section">
  <div class="container">
    <div class="row align-items-center g-4 g-lg-5">
      <div class="col-12 col-lg-6">
        <h1 id="home-hero-title">{{ .headline }}</h1>
        <p class="lead">{{ .subheading }}</p>
        <div class="d-flex flex-wrap gap-3">
          <a class="btn btn-primary" href="{{ .primary_cta.url }}">{{ .primary_cta.label }}</a>
          <a class="btn btn-outline-charcoal" href="{{ .secondary_cta.url }}">{{ .secondary_cta.label }}</a>
        </div>
      </div>
      <div class="col-12 col-lg-6">
        <div class="home-hero-visual bg-light" role="img" aria-label="{{ .visual }}">{{ .visual }}</div>
      </div>
    </div>
  </div>
</section>
