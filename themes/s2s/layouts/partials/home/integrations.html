<section class="home-section">
  <div class="container">
    <h2 class="mb-4">{{ .heading }}</h2>
    {{ range .groups }}
      <div class="mb-4">
        <h3 class="h5 mb-3">{{ .label }}</h3>
        <div class="row row-cols-2 row-cols-lg-{{ .desktop_columns }} g-3">
          {{ range .tiles }}
            <div class="col">
              <a class="home-integration-tile" href="{{ .url | relURL }}">{{ .name }}</a>
            </div>
          {{ end }}
        </div>
      </div>
    {{ end }}
    <a href="{{ .view_all.url | relURL }}">{{ .view_all.label }}</a>
  </div>
</section>
