<section class="home-section">
  <div class="container">
    <h2 class="mb-4">{{ .heading }}</h2>
    <div class="row row-cols-1 row-cols-md-3 g-4">
      {{ range .steps }}
        <div class="col">
          <article>
            <p class="home-step-number mb-2">{{ .number }}</p>
            <h3 class="h5">{{ .title }}</h3>
            <p class="mb-0">{{ .text }}</p>
          </article>
        </div>
      {{ end }}
    </div>
  </div>
</section>
