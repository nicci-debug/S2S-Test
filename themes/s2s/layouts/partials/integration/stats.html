{{ with .Params.stats }}
  <section class="integration-section integration-stats">
    <div class="row g-3">
      {{ range . }}
        {{ if and .value .label }}
          <div class="col-6 col-md-4">
            <div class="h-100 p-3 border bg-light">
              <div class="integration-stat-value">{{ .value }}</div>
              <div>{{ .label }}</div>
            </div>
          </div>
        {{ end }}
      {{ end }}
    </div>
  </section>
{{ end }}
