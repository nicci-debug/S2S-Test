{{ define "main" }}
  <section class="container py-5">
    {{ with .Title }}<h1>{{ . }}</h1>{{ end }}
    {{ .Content }}
    {{ with .Pages }}
      <ul>
        {{ range . }}
          <li><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></li>
        {{ end }}
      </ul>
    {{ end }}
  </section>
{{ end }}
